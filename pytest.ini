[pytest]
addopts =
    --nbmake
    --nbmake-timeout=1800
    # the fine-tuning notebooks need a CUDA GPU, the test runners don't have one
    --ignore=2-Tutorial_Transformer_Finetuning.ipynb
    --ignore=2-Tutorial_Transformer_Finetuning_Solutions.ipynb

testpaths = .
norecursedirs = .* docs distilbert-emotion-training t5-opus-books-training
